# Added by the NethServer module: password-protected entry point for the
# netboot.xyz web app, which has no authentication of its own. Published on the
# node loopback and fronted by Traefik.
server {
    listen 8080;
    server_name _;

    auth_basic "netboot.xyz";
    auth_basic_user_file /config/nginx/ns8-htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # The web app talks to the browser over socket.io (WebSocket).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
